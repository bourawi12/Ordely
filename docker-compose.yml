name: ordely

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ordely}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ordely}
      POSTGRES_DB: ${POSTGRES_DB:-ordely}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for user uploads (profile pictures…).
  # Console: http://localhost:${MINIO_CONSOLE_PORT:-9101}
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ordely}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ordely-minio-secret}
    ports:
      - "${MINIO_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email the app sends (nothing is delivered) and shows it in a web inbox:
  # http://localhost:${MAILPIT_UI_PORT:-8025}. Point SMTP_HOST at a real provider to send for real.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      # SMTP, for a backend running outside Docker (npm run start:dev).
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-ordely}:${POSTGRES_PASSWORD:-ordely}@db:5432/${POSTGRES_DB:-ordely}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (e.g. openssl rand -hex 32)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-86400}
      # The API talks to MinIO inside the network; browsers load files through
      # signed URLs on the public address.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9100}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-ordely}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-ordely-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-ordely-media}
      # Outgoing email (verification links). Defaults to the Mailpit catcher above.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Ordely <no-reply@ordely.tn>}
      # Where the links in emails point: the address users open the app at.
      APP_URL: ${APP_URL:-http://localhost:3200}
      # Internal back office (/admin): this account gets access at startup.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Back office unit economics: estimated telephony + AI cost, in TND.
      COST_PER_MINUTE: ${COST_PER_MINUTE:-0.35}
      COST_PER_CALL: ${COST_PER_CALL:-0.02}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3001/api
    ports:
      - "${FRONTEND_PORT:-3200}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
  minio-data:
