# Development mode: live reload inside Docker.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# The source folders are mounted from your disk, the backend runs `nest start --watch`
# and the frontend `next dev`, so a saved file shows up without rebuilding the image.
# Rebuild (`--build`) only after changing package.json. Add `-V` to refresh node_modules.
# Production (`docker compose up -d --build` without this file) is unchanged.

services:
  backend:
    build:
      context: ./backend
      # The image stage with node_modules installed for Linux (and the Prisma client).
      target: deps
    # Regenerate the Prisma client in case the schema changed, apply migrations, then watch.
    # nest-cli.docker.json only turns off deleteOutDir: dist/ is a volume and cannot be removed.
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx nest start --watch -c nest-cli.docker.json"
    environment:
      NODE_ENV: development
    volumes:
      - ./backend:/app
      # Keep the container's own node_modules and build output: the host ones are
      # built for another platform and belong to local `npm run start:dev`.
      - /app/node_modules
      - /app/dist
    healthcheck:
      # The first TypeScript compile takes a while in watch mode.
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      target: deps
    command: npx next dev -p 3000 -H 0.0.0.0
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # A separate .next so the container never collides with a local `npm run dev`.
      - /app/.next
